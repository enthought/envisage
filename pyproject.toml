[build-system]
requires = ['uv_build>=0.12.2,<0.13']
build-backend = 'uv_build'

[project]
name = 'envisage'
version = '8.0.0'
description = 'Extensible application framework'
readme = 'README.rst'
requires-python = '>= 3.10'
license = 'BSD-3-Clause'
license-files = ['LICENSE.txt', 'image_LICENSE.txt', 'image_LICENSE_CP.txt']
authors = [{name = 'Enthought', email = 'info@enthought.com'}]
keywords = ['extensible', 'plugin', 'application', 'framework']
classifiers = [
    'Development Status :: 5 - Production/Stable',
    'Intended Audience :: Developers',
    'Intended Audience :: Science/Research',
    'Operating System :: MacOS :: MacOS X',
    'Operating System :: Microsoft :: Windows',
    'Operating System :: POSIX :: Linux',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: Implementation :: CPython',
    'Topic :: Scientific/Engineering',
    'Topic :: Software Development',
    'Topic :: Software Development :: Libraries',
    'Topic :: Software Development :: User Interfaces',
]
dependencies = [
    'apptools[preferences]>=5.3',
    'pyface',
    'traits>=6.2',
    'traitsui',
]

[project.entry-points.'envisage.plugins']
'envisage.core' = 'envisage.core_plugin:CorePlugin'

[project.entry-points.etsdemo_data]
demo_examples = 'envisage.examples._etsdemo_info:info'

[project.urls]
documentation = 'https://docs.enthought.com/envisage/'
repository = 'https://github.com/enthought/envisage'
issues = 'https://github.com/enthought/envisage/issues'

[dependency-groups]
gui = [
    'pyside6',
]
docs = [
    'Sphinx==9.1.0',
    'enthought-sphinx-theme==0.7.4',
    'sphinx-copybutton==0.5.2',
    # A toolkit is needed for accurate API documentation from autodoc.
    {include-group = 'gui'},
]
style = [
    'black>=24.3,<27.0',
    'flake8',
    'flake8-ets >= 1.1.0',
    'isort',
]
test = [
    'pytest',
]
dev = [
    {include-group = 'gui'},
    {include-group = 'style'},
    {include-group = 'test'},
]

[tool.black]
line-length = 79

[tool.isort]
profile = 'black'
line_length = 79
order_by_type = false
sections = ['FUTURE', 'STDLIB', 'THIRDPARTY', 'ENTHOUGHT', 'FIRSTPARTY', 'LOCALFOLDER']
known_enthought = ['apptools', 'pyface', 'traits', 'traitsui']

[tool.pytest.ini_options]
filterwarnings = [
    'error',
    # Ignore TraitsUI's import-time warning when numpy isn't installed.
    'ignore:ArrayEditor is not available:ImportWarning',
]

[tool.uv.build-backend]
module-root = ''

[tool.uv.dependency-groups]
# The pinned Sphinx needs 3.12+; docs are only ever built on the latest Python.
docs = { requires-python = '>= 3.12' }

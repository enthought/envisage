[build-system]
requires = ['uv_build>=0.12.2,<0.13']
build-backend = 'uv_build'

[project]
name = 'envisage'
version = '8.0.0'
description = 'Extensible application framework'
readme = 'README.rst'
requires-python = '>= 3.10'
license = 'BSD-3-Clause'
license-files = ['LICENSE.txt', 'image_LICENSE.txt', 'image_LICENSE_CP.txt']
authors = [{name = 'Enthought', email = 'info@enthought.com'}]
keywords = ['extensible', 'plugin', 'application', 'framework']
classifiers = [
    'Development Status :: 5 - Production/Stable',
    'Intended Audience :: Developers',
    'Intended Audience :: Science/Research',
    'Operating System :: MacOS :: MacOS X',
    'Operating System :: Microsoft :: Windows',
    'Operating System :: POSIX :: Linux',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: Implementation :: CPython',
    'Topic :: Scientific/Engineering',
    'Topic :: Software Development',
    'Topic :: Software Development :: Libraries',
    'Topic :: Software Development :: User Interfaces',
]
dependencies = [
    'apptools[preferences]>=5.3',
    'pyface',
    'traits>=6.2',
    'traitsui',
]

[project.entry-points.'envisage.plugins']
'envisage.core' = 'envisage.core_plugin:CorePlugin'

[project.entry-points.etsdemo_data]
demo_examples = 'envisage.examples._etsdemo_info:info'

[project.urls]
documentation = 'https://docs.enthought.com/envisage/'
repository = 'https://github.com/enthought/envisage'
issues = 'https://github.com/enthought/envisage/issues'

[dependency-groups]
gui = [
    # Needed for Pyface's PythonShell, used by the python_shell plugin.
    'pygments',
    'pyside6',
]
docs = [
    'Sphinx==9.1.0',
    'enthought-sphinx-theme==0.7.5',
    'sphinx-copybutton==0.5.2',
    # A toolkit is needed for accurate API documentation from autodoc.
    {include-group = 'gui'},
]
style = [
    'ruff ~= 0.16.0',
]
test = [
    'pytest',
]
dev = [
    {include-group = 'gui'},
    {include-group = 'style'},
    {include-group = 'test'},
]

[tool.pytest.ini_options]
filterwarnings = [
    'error',
    # Ignore TraitsUI's import-time warning when numpy isn't installed.
    'ignore:ArrayEditor is not available:ImportWarning',
    # Pyface announces the move on import, and envisage.ui.workbench is built
    # on it; there is nowhere for it to move to until the code follows.
    'ignore:Workbench will be moved from pyface:PendingDeprecationWarning',
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ['CPY001', 'E', 'F', 'I', 'W']

[tool.ruff.lint.per-file-ignores]
'*/api.py' = ['F401']

[tool.ruff.lint.flake8-copyright]
# Empty files don't need a copyright header.
min-file-size = 1
# The copyright header, as a regular expression: hence the escaped parentheses
# and periods, and the leading \A anchoring the match to the start of the file.
# The end year here is the single source of truth: CPY001 holds every source
# file to it, and the check-copyright-year workflow holds it to the current
# year.
notice-rgx = '''\A# \(C\) Copyright 2007-2026 Enthought, Inc\., Austin, TX
# All rights reserved\.
#
# This software is provided without warranty under the terms of the BSD
# license included in LICENSE\.txt and may be redistributed only under
# the conditions described in the aforementioned license\. The license
# is also available online at http://www\.enthought\.com/licenses/BSD\.txt
#
# Thanks for using Enthought open source!'''

[tool.ruff.lint.isort]
order-by-type = false
# Demo applications that are run from their own directory, so their absolute
# imports aren't imports of Envisage itself.
known-third-party = ['acme', 'attractors']
section-order = [
    'future',
    'standard-library',
    'third-party',
    'enthought',
    'first-party',
    'local-folder',
]

[tool.ruff.lint.isort.sections]
enthought = ['apptools', 'pyface', 'traits', 'traitsui']

[tool.uv.dependency-groups]
# The pinned Sphinx needs 3.12+; docs are only ever built on the latest Python.
docs = { requires-python = '>= 3.12' }

name: Test with the latest releases

# The other test workflows install from uv.lock, so a new upstream release
# can't break them. This one ignores the lock and resolves afresh, to find
# out about such a release before a lock update pulls it in.

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  schedule:
    # Every Friday at 00:00 UTC
    - cron:  '0 0 * * 5'

env:
  PYTHONUNBUFFERED: 1

jobs:

  test-with-latest:
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest']
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']

    runs-on: ${{ matrix.os }}

    steps:
      - name: Clone the Envisage source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install packages for Qt support
        uses: ./.github/actions/install-qt-support
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-suffix: latest
      - name: Show the dependency tree
        run: uv tree --upgrade
      - name: Run tests (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a uv run --upgrade -m pytest
      - name: Run tests (not Ubuntu)
        if: matrix.os != 'ubuntu-latest'
        run: uv run --upgrade -m pytest

name: Test with PyPI

on: [pull_request, workflow_dispatch]

env:
  PYTHONUNBUFFERED: 1
  # Importing Pyface's toolkit creates a QApplication, so the tests need a Qt
  # platform plugin that works without a display.
  QT_QPA_PLATFORM: offscreen

jobs:

  test-with-pypi:
    strategy:
      matrix:
        os: ['ubuntu-latest', 'macos-latest', 'windows-latest']
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']

    runs-on: ${{ matrix.os }}

    steps:
      - name: Clone the Envisage source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install packages for Qt support
        uses: ./.github/actions/install-qt-support
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-suffix: test
      - name: Show the dependency tree
        run: uv tree --locked
      - name: Run tests
        run: uv run --locked -m pytest

  # A smoke test that Envisage doesn't depend on a GUI toolkit being
  # installed, and that the tests needing one skip rather than fail.
  test-without-toolkit:
    runs-on: 'ubuntu-latest'

    steps:
      - name: Clone the Envisage source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.14'
          enable-cache: true
          cache-suffix: test-without-toolkit
      - name: Run tests, reporting what was skipped
        run: uv run --locked --no-default-groups --group test -m pytest -rs

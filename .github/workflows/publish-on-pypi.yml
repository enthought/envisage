name: Publish release to PyPI

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Check out the release commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        python-version: '3.14'
        enable-cache: true
        cache-suffix: publish
    - name: Build sdist and wheel
      run: uv build
    # --trusted-publishing always, rather than the default automatic, so that
    # a missing OIDC token fails here instead of falling back to looking for
    # credentials that this workflow doesn't have.
    - name: Publish to PyPI
      run: uv publish --trusted-publishing always

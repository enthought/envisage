name: Update gh-pages documentation

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  UV_PYTHON: '3.14'

jobs:
  update-docs:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        enable-cache: true
        cache-dependency-glob: 'docs/requirements.txt'
    - run: |
        uv venv
        uv pip install -r docs/requirements.txt .
    - run: |
        uv run --no-project python -m sphinx -b html -d docs/build/doctrees docs/source docs/build/html
    - name: Check out gh-pages branch
      run: |
        git fetch --depth=1 origin gh-pages
        git worktree add ../docs gh-pages
    - name: Update the docs on the gh-pages branch
      run: |
        uv run --no-project python docs/update_gh_pages.py docs/build/html ../docs
    - name: Configure Git
      run: |
        git config user.name "Documentation Bot"
        git config user.email "info@enthought.com"
    - name: Commit the changes
      run: |
        cd ../docs
        git add .
        # Only commit if there are changes
        git diff-index --quiet --cached HEAD || git commit -m "Automated update of main branch documentation"
    - name: Push the changes upstream
      run: |
        git push origin gh-pages

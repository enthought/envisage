name: Run style checks

on: [pull_request, workflow_dispatch]

env:
  UV_PYTHON: '3.14'
  STYLE_REQUIREMENTS: .github/workflows/style-requirements.txt

jobs:
  style:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        enable-cache: true
        cache-dependency-glob: '.github/workflows/style-requirements.txt'
    - run: |
        uv run --no-project --with-requirements "$STYLE_REQUIREMENTS" -- python -m black --check --diff .
        uv run --no-project --with-requirements "$STYLE_REQUIREMENTS" -- python -m isort --check --diff .
        uv run --no-project --with-requirements "$STYLE_REQUIREMENTS" -- python -m flake8 .

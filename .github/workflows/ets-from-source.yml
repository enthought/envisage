name: Test with ETS packages from source

on:
  workflow_dispatch:
  schedule:
    # Every Friday at 00:00 UTC
    - cron:  '0 0 * * 5'

env:
  PYTHONUNBUFFERED: 1
  # Importing Pyface's toolkit creates a QApplication, so the tests need a Qt
  # platform plugin that works without a display.
  QT_QPA_PLATFORM: offscreen

jobs:

  ets-from-source:
    strategy:
      matrix:
        os: ['ubuntu-latest', 'macos-latest', 'windows-latest']

    runs-on: ${{ matrix.os }}

    steps:
      - name: Clone the Envisage source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.14'
          enable-cache: true
          cache-suffix: ets-from-source
      - name: Point the ETS dependencies at their main branches
        run: >
          uv add --branch main
          "traits @ git+https://github.com/enthought/traits.git"
          "pyface @ git+https://github.com/enthought/pyface.git"
          "traitsui @ git+https://github.com/enthought/traitsui.git"
          "apptools[preferences] @ git+https://github.com/enthought/apptools.git"
      - name: Run tests
        run: uv run -m pytest

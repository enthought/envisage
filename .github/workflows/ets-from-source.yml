name: Test with ETS packages from source

# Dependabot keeps uv.lock current with PyPI *releases*. This workflow is the
# earlier signal: it installs the ETS dependencies from their main branches, so
# that a change breaking Envisage is caught before it is released.

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  schedule:
    # Every Friday at 00:00 UTC
    - cron:  '0 0 * * 5'

env:
  PYTHONUNBUFFERED: 1
  # Deliberately not the locked environment: the point is to resolve afresh
  # against the ETS main branches.
  VIRTUAL_ENV: ${{ github.workspace }}/.venv

jobs:

  ets-from-source:
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest', 'macos-latest', 'windows-latest']
        toolkit: ['null', 'pyside6']

    runs-on: ${{ matrix.os }}

    steps:
      - name: Clone the Envisage source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install packages for Qt support
        uses: ./.github/actions/install-qt-support
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.14'
          enable-cache: true
          cache-suffix: ets-from-source
      - name: Create the environment
        run: uv venv
      - name: Install the GUI toolkit
        if: matrix.toolkit != 'null'
        run: uv pip install ${{ matrix.toolkit }}
      # One invocation, so that the four main branches and Envisage's own
      # requirements resolve together. The apptools extra has to be spelled
      # out: a bare git URL would drop it, and configobj with it.
      - name: Install Envisage and the ETS dependencies from GitHub
        run: >
          uv pip install
          "traits @ git+https://github.com/enthought/traits.git"
          "pyface @ git+https://github.com/enthought/pyface.git"
          "traitsui @ git+https://github.com/enthought/traitsui.git"
          "apptools[preferences] @ git+https://github.com/enthought/apptools.git"
          pytest .
      # A version number proves nothing here: the ETS main branches carry no
      # .dev suffix, so a silent fall back to the PyPI release would look
      # identical. uv pip freeze reports the git URL and commit.
      - name: Check that the ETS packages came from git
        shell: bash
        run: |
          uv pip freeze | tee installed.txt
          for package in traits pyface traitsui apptools; do
            if ! grep -q "^${package} @ git+" installed.txt; then
              echo "::error::${package} was not installed from git"
              exit 1
            fi
          done
      # The tests run from outside the source tree, so that they exercise the
      # installed package rather than the local copy. The pytest configuration
      # is still taken from the repository.
      - name: Run tests (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        working-directory: ${{ runner.temp }}
        run: xvfb-run -a uv run --no-project -m pytest -c ${{ github.workspace }}/pyproject.toml --pyargs envisage
      - name: Run tests (not Ubuntu)
        if: matrix.os != 'ubuntu-latest'
        working-directory: ${{ runner.temp }}
        run: uv run --no-project -m pytest -c ${{ github.workspace }}/pyproject.toml --pyargs envisage
